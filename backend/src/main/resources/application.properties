server.port=8080

# H2 em memoria (troque por PostgreSQL em producao)
spring.datasource.url=jdbc:h2:mem:castroadvocacia
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Console H2 desabilitado (Sensitive Data Exposure)
spring.h2.console.enabled=false

# Inicializar dados via data.sql
spring.sql.init.mode=always

# JWT
app.jwt.secret=CastroAdvocacia2025PlatformSecretKeyMin32BytesLong!!
app.jwt.expiration-ms=86400000

# Limites de upload (File Upload Vulnerability)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Nao expor detalhes de erro (Sensitive Data Exposure)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
