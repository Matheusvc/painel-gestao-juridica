name: Deploy

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - ".dockerignore"
      - "captain-definition"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Package repo
        run: git archive --format=tar -o deploy.tar HEAD

      - name: Deploy to CapRover
        env:
          CAPROVER_URL: ${{ vars.CAPROVER_URL }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
        run: |
          : "${CAPROVER_URL:?Variable CAPROVER_URL não configurada no GitHub}"
          : "${CAPROVER_APP_TOKEN:?Secret CAPROVER_APP_TOKEN não configurado no GitHub}"
          npx -y caprover deploy \
            --caproverUrl "$CAPROVER_URL" \
            --appToken "$CAPROVER_APP_TOKEN" \
            --appName backend \
            --tarFile deploy.tar
